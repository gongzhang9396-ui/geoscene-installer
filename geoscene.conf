# GeoScene Enterprise 安装配置文件 (v7.0)
# 用于自动化安装，所有变量均可覆盖脚本默认值
#
# 使用方式:
#   1. 复制此文件为 geoscene.conf（或自定义名称）
#   2. 根据需要修改配置
#   3. 运行: bash install-geoscene.sh
#   或: bash install-geoscene.sh --config=geoscene.conf
#
# 重要提示：
# 1. 强烈建议配置 FQDN (完全限定域名) 以避免 localhost 跳转问题
# 2. 所有密码必须满足 GeoScene 要求（8位以上，包含大小写字母和数字）
# 3. 路径必须是绝对路径
#==============================================================================

#==============================================================================
# 用户和目录配置
#==============================================================================
# 运行 GeoScene 的系统用户名
GS_USER=geoscene

# 用户所属组名
GS_GROUP=geoscene

# 用户 home 目录
GS_HOME=/home/geoscene

# GeoScene 安装基础目录
GS_BASE=/home/geoscene/geoscene

# 安装包和授权文件目录
DATA_DIR=/geoscenedata
LICENSE_DIR=/geoscenedata/licfile
SERVER_LICENSE_FILE=GeoSceneServerAdvanced_GeoSceneServer_1626763.ecp
PORTAL_LICENSE_FILE=GeoScene_Enterprise_Portal_61_576425_20260720.json

#==============================================================================
# 端口配置（通常不需要修改）
#==============================================================================
# Server HTTPS 端口
SERVER_PORT=6443

# Portal HTTPS 端口
PORTAL_PORT=7443

# DataStore HTTPS 端口
DATASTORE_PORT=2443

#==============================================================================
# 主机名和域名配置（关键！解决 localhost 跳转问题）
#==============================================================================
# FQDN (完全限定域名) - 强烈建议配置，例如: portal.geosceneenterprise.cn
# 如果不配置，脚本将自动使用 IP 地址
FQDN=portal229.geosceneenterprise.com

# 主机名 - 如果 FQDN 为 portal.geosceneenterprise.cn，则 HOSTNAME 应为 portal
HOSTNAME=portal229

# 是否配置主机名 (true/false)
# true: 自动配置 /etc/hostname 和 /etc/hosts
# false: 跳过主机名配置（如果已手动配置）
CONFIGURE_HOSTNAME=true
CONFIGURE_HOSTS=true
DISABLE_IPV6=true

#==============================================================================
# Server 管理员账户配置
#==============================================================================
SITE_ADMIN_USER=siteadmin
# 请在实际部署前替换为强密码；此处仅为公开仓库示例值
SITE_ADMIN_PASS=ChangeMe123!

#==============================================================================
# Portal 管理员账户配置
#==============================================================================
PORTAL_ADMIN_USER=portaladmin
# 请在实际部署前替换为强密码；此处仅为公开仓库示例值
PORTAL_ADMIN_PASS=ChangeMe123!
PORTAL_ADMIN_EMAIL=geoscene@geoscene.com
PORTAL_ADMIN_FN=Admin
PORTAL_ADMIN_LN=User

# Portal 安全问题（用于账户恢复）
PORTAL_ADMIN_QI=1
PORTAL_ADMIN_QA=Beijing

#==============================================================================
# WebAdaptor 配置（v7.0: 现在是必选组件）
#==============================================================================
# 是否安装并配置 WebAdaptor
# v7.0: WebAdaptor 现在是必选组件，提供 443 端口的反向代理功能
INSTALL_WEBADAPTOR=true

# Tomcat 版本（v7.0: 自动下载安装）
# 默认: 9.0.89（支持 GeoScene Enterprise 4.1）
TOMCAT_VERSION=9.0.89

# Tomcat 安装目录
# v7.0: 如果不存在，将自动下载并安装
TOMCAT_HOME=/opt/tomcat

# JDK 版本（v7.0: 自动下载安装，Adoptium/Temurin）
# 支持的版本: 17（推荐）, 11, 8
# 默认: 17（GeoScene Enterprise 4.1 推荐版本）
JDK_VERSION=17

# JDK 安装目录
# v7.0: 如果不存在，将自动从 Adoptium API 下载并安装
JDK_HOME=/opt/jdk

# WebAdaptor 端口（默认 443）
WEBADAPTOR_PORT=443

# WebAdaptor 上下文（默认 geoscene）
# 访问地址: https://<FQDN>/<WEBADAPTOR_CONTEXT>
WEBADAPTOR_CONTEXT=geoscene

# Server WebAdaptor 上下文（默认 server）
# 访问地址: https://<FQDN>/<SERVER_WEBADAPTOR_CONTEXT>
SERVER_WEBADAPTOR_CONTEXT=server

#==============================================================================
# SSL/TLS 证书配置（v7.0: 可选但推荐）
#==============================================================================
# 是否创建自签名 SSL 证书（用于 WebAdaptor HTTPS）
# true: 自动创建自签名证书（适合测试环境）
# false: 使用现有证书或不使用 HTTPS（不推荐用于生产环境）
# 生产环境建议使用由 CA 签发的证书
CREATE_SELF_SIGNED_CERT=true

# 证书信息（仅在 CREATE_SELF_SIGNED_CERT=true 时有效）
CERT_COUNTRY=CN
CERT_STATE=Beijing
CERT_CITY=Beijing
CERT_ORG=portal229.geosceneenterprise.com
CERT_OU=portal229.geosceneenterprise.com
CERT_EMAIL=geoscene@geoscene.com
CERT_DAYS=3650
# 请在实际部署前替换为证书密码；此处仅为公开仓库示例值
CERT_PASSWORD=ChangeMe123!

#==============================================================================
# 系统资源要求配置（通常不需要修改）
#==============================================================================
# 最小内存要求 (MB)
# GeoScene Enterprise 4.1 最低要求: 8192 MB
# 建议生产环境: 16384 MB 或更高
MIN_RAM_MB=8192

# 最小 CPU 核数
# GeoScene Enterprise 4.1 最低要求: 4 核
# 建议生产环境: 8 核或更高
MIN_CPU_CORES=4

# home 目录最小磁盘空间要求 (GB)
# 用于存储用户数据和配置文件
MIN_DISK_HOME_GB=20

# 安装目录最小磁盘空间要求 (GB)
# 用于安装 GeoScene 软件
MIN_DISK_INSTALL_GB=30

#==============================================================================
# 自动下载配置（v7.0: 新增功能）
#==============================================================================
# 是否自动下载缺失的依赖（JDK, Tomcat）
# true: 自动从官方源下载并安装（需要网络连接）
# false: 仅使用本地已有的依赖
AUTO_DOWNLOAD=false

#==============================================================================
# 注意事项和说明
#==============================================================================
# 1. 配置文件中不要使用特殊字符或空格
# 2. 端口配置通常不需要修改，除非有特殊需求
# 3. 如需自定义目录，请确保路径存在且有足够空间
# 4. 管理员密码建议在生产环境中修改为强密码
# 5. 脚本会自动检测服务器实际 IP，无需手动配置
#
#==============================================================================
# 授权文件命名规则
#==============================================================================
# 1. Server 授权文件 (*.prvc 或 *.ecp):
#    - 文件名可以任意命名
#    - 系统会自动识别为 Server 授权
#    - 示例: authorization.prvc, server_license.ecp
#    - 注意: 不要与 Portal 授权文件混淆
#
# 2. Portal 授权文件 (*.json):
#    - 文件名需要包含 "portal" 或 "enterprise" 关键字
#    - 系统会自动识别为 Portal 授权
#    - 示例: portal_license.json, enterprise_portal.json
#    - 注意: 不要与 Server 授权文件混淆
#
# 3. 重要: 如果同时存在多个授权文件，系统可能会选择第一个匹配的
#    为避免混淆，建议只保留一个 Server 授权和一个 Portal 授权
#
#==============================================================================
# 配置文件版本历史
#==============================================================================
# v7.0 - 新增: 自动下载 JDK/Tomcat、多平台支持
# v6.0 - 新增: FQDN配置、证书管理、WebAdaptor 配置
# v5.1 - 增强: 稳定性改进、重试逻辑、状态检测
# v5.0 - 初始版本: 基础自动化安装功能
#==============================================================================
