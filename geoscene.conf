# GeoScene Enterprise 配置文件模板
# 用于自动化安装，所有变量均可覆盖脚本默认值

#==============================================================================
# 用户和目录配置
#==============================================================================
# 运行 GeoScene 的系统用户名
GS_USER=geoscene

# 用户所属组名
GS_GROUP=geoscene

# 用户 home 目录
GS_HOME=/home/geoscene

# GeoScene 安装基础目录
GS_BASE=/home/geoscene/geoscene

#==============================================================================
# 端口配置（通常不需要修改）
#==============================================================================
# Server HTTPS 端口
SERVER_PORT=6443

# Portal HTTPS 端口
PORTAL_PORT=7443

# DataStore HTTPS 端口
DATASTORE_PORT=2443

#==============================================================================
# 管理员账户配置（用于自动创建站点和门户）
#==============================================================================
# Server 站点管理员账户
SITE_ADMIN_USER=siteadmin
SITE_ADMIN_PASS=YourPassword123

# Portal 管理员账户
PORTAL_ADMIN_USER=portaladmin
PORTAL_ADMIN_PASS=YourPassword123
PORTAL_ADMIN_EMAIL=portaladmin@example.com
PORTAL_ADMIN_FN=Admin
PORTAL_ADMIN_LN=User

# Portal 安全问题（用于账户恢复）
PORTAL_ADMIN_QI=1
PORTAL_ADMIN_QA=Beijing

#==============================================================================
# 系统资源要求配置（通常不需要修改）
#==============================================================================
# 最小内存要求 (MB)
MIN_RAM_MB=8192

# 最小 CPU 核数
MIN_CPU_CORES=4

# home 目录最小磁盘空间要求 (GB)
MIN_DISK_HOME_GB=20

# 安装目录最小磁盘空间要求 (GB)
MIN_DISK_INSTALL_GB=30

#==============================================================================
# 注意事项
#==============================================================================
# 1. 配置文件中不要使用特殊字符或空格
# 2. 端口配置通常不需要修改，除非有特殊需求
# 3. 如需自定义目录，请确保路径存在且有足够空间
# 4. 管理员密码建议在生产环境中修改为强密码
# 5. 脚本会自动检测服务器实际 IP，无需手动配置
# 6. 授权文件命名规则:
#    - Server 授权: *.prvc 或 *.ecp 文件 (任意命名都会识别为 Server 授权)
#      示例: GeoSceneServerAdvanced_*.prvc, authorization_geoscene_*.ecp
#    - Portal 授权: *.json 文件，文件名需包含 "portal" 或 "enterprise"
#      示例: GeoScene_Enterprise_Portal_*.json, portal_license.json
#    - 注意: 如果有多个 Server 授权文件，脚本会选择第一个匹配的